name: Prime Tech development
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          VITE_DATA_MODE: ${{ vars.VITE_DATA_MODE || 'supabase' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://gwvssoaqvqcmofdsirtl.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    name: E2E · fluxo operacional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Instalar Playwright apenas no runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E em dados isolados
        run: npx playwright test --project=chromium-desktop
        env:
          CI: 'true'
      - name: Guardar relatório quando houver falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish development
        id: deployment
        uses: actions/deploy-pages@v4
